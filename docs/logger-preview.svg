<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background split: Dark Theme (left) / Light Theme (right) -->
  <rect x="0" y="0" width="480" height="540" fill="#141311"/>
  <rect x="480" y="0" width="480" height="540" fill="#f4f3ef"/>
  <line x1="480" y1="0" x2="480" y2="540" stroke="#3a3832" stroke-width="1"/>

  <!-- ================= LEFT: DARK THEME ================= -->
  <g transform="translate(20, 18)">
    <!-- Header -->
    <text x="0" y="20" fill="#ecebe6" font-size="16" font-weight="600">LuxMeter Logger</text>
    <rect x="348" y="2" width="92" height="28" rx="6" fill="none" stroke="#a9a59b"/>
    <text x="394" y="20" fill="#ecebe6" font-size="12" text-anchor="middle">Light theme</text>

    <!-- Connection Bar -->
    <rect x="0" y="40" width="440" height="52" rx="8" fill="#1c1b18" stroke="#3a3832"/>
    <circle cx="20" cy="66" r="5" fill="#f2b338"/>
    <text x="34" y="71" fill="#ecebe6" font-size="13">Live. Receiving from LuxMeter.</text>
    <rect x="332" y="50" width="96" height="32" rx="6" fill="#ecebe6"/>
    <text x="380" y="71" fill="#141311" font-size="13" font-weight="600" text-anchor="middle">Disconnect</text>

    <!-- Readout Panel -->
    <rect x="0" y="102" width="440" height="148" rx="8" fill="#1c1b18" stroke="#3a3832"/>
    <text x="16" y="168" fill="#f2b338" font-size="56" font-weight="600" letter-spacing="-1">342.2</text>
    <text x="164" y="168" fill="#a9a59b" font-size="18" font-weight="500">lux</text>
    <text x="16" y="190" fill="#a9a59b" font-size="13">Gain 25x, at 14:22:08</text>

    <!-- Window Stats -->
    <text x="296" y="126" fill="#a9a59b" font-size="12">In graph window</text>
    <text x="296" y="146" fill="#a9a59b" font-size="13">Min</text>
    <text x="424" y="146" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="end">118.4</text>
    <text x="296" y="166" fill="#a9a59b" font-size="13">Max</text>
    <text x="424" y="166" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="end">412.0</text>
    <text x="296" y="186" fill="#a9a59b" font-size="13">Average</text>
    <text x="424" y="186" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="end">298.6</text>

