    <text x="16" y="468" fill="#5c5850" font-size="12" font-weight="600">Time</text>
    <text x="340" y="468" fill="#5c5850" font-size="12" font-weight="600" text-anchor="end">Lux</text>
    <text x="424" y="468" fill="#5c5850" font-size="12" font-weight="600" text-anchor="end">Gain</text>

    <text x="16" y="492" fill="#1d1c19" font-size="12">2026-11-18 14:22:08</text>
    <text x="340" y="492" fill="#1d1c19" font-size="12" text-anchor="end">342.2</text>
    <text x="424" y="492" fill="#1d1c19" font-size="12" text-anchor="end">25x</text>
