    <rect x="16" y="210" width="408" height="6" rx="3" fill="#3a3832"/>
    <rect x="278" y="205" width="4" height="16" rx="2" fill="#f2b338"/>
    <g fill="#a9a59b" font-size="11">
      <text x="16" y="234">0.01</text>
      <text x="74" y="234" text-anchor="middle">0.1</text>
      <text x="132" y="234" text-anchor="middle">1</text>
      <text x="191" y="234" text-anchor="middle">10</text>
      <text x="249" y="234" text-anchor="middle">100</text>
      <text x="307" y="234" text-anchor="middle">1k</text>
      <text x="366" y="234" text-anchor="middle">10k</text>
      <text x="424" y="234" text-anchor="end">100k</text>
    </g>

