      <text x="16" y="334">330.0</text>
      <text x="16" y="360">210.0</text>
      <text x="16" y="386">90.0</text>
      <text x="52" y="402">14:12:08</text>
      <text x="424" y="402" text-anchor="end">14:22:08</text>
