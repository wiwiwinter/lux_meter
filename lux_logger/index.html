<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuxMeter Logger</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #111; color: #eee; max-width: 900px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  button, select { font-size: 16px; padding: 10px 14px; margin: 4px 4px 4px 0; border-radius: 6px;
                   border: 1px solid #666; background: #222; color: #eee; }
  button:focus-visible, select:focus-visible { outline: 2px solid #fc3; outline-offset: 2px; }
  #now { font-size: 48px; font-weight: 600; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  #status { color: #bbb; min-height: 1.4em; }
  canvas { width: 100%; height: 260px; background: #000; border: 1px solid #333; display: block; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8px; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #333; }
</style>
</head>
<body>
<h1>LuxMeter Logger</h1>
<button id="conn">Connect</button>
<button id="csv">Download CSV</button>
<button id="clear">Clear log</button>
<label>Graph <select id="win">
  <option value="60">1 min</option>
  <option value="600" selected>10 min</option>
  <option value="3600">1 hour</option>
  <option value="0">All</option>
</select></label>
<div id="now">-- lux</div>
<div id="status" role="status"></div>
<canvas id="graph" aria-label="Lux over time"></canvas>
<table>
  <thead><tr><th>Time</th><th>Lux</th><th>Gain</th></tr></thead>
  <tbody id="log"></tbody>
</table>

<script>
const SPP = '00001101-0000-1000-8000-00805f9b34fb';  // standard Bluetooth serial service
const KEY = 'luxlog';
const GAP_MS = 5000;  // longer silence (HOLD, too bright) breaks the graph line
const $ = id => document.getElementById(id);

// Each row: [phone/PC time in ms, ESP32 millis, lux, gain]
let rows = JSON.parse(localStorage.getItem(KEY) || '[]');
let port = null, reader = null, unsaved = false, lastRx = 0;

const dec = v => v < 10 ? 2 : (v < 1000 ? 1 : 0);  // same rule as the OLED
const pad = n => String(n).padStart(2, '0');
const stamp = t => { const d = new Date(t);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const status = s => $('status').textContent = s;

// One CSV line from the ESP32 ("12345,342.18,25x") -> row, or null for the header or junk.
function parseLine(line, now) {
  const p = line.trim().split(',');
  if (p.length !== 3 || p[0] === '' || p[1] === '' || !/^\d+x$/.test(p[2])) return null;
  const ms = Number(p[0]), lux = Number(p[1]);
  if (!Number.isFinite(ms) || !Number.isFinite(lux)) return null;
  return [now, ms, lux, p[2]];
}

function save() {
  if (!unsaved) return;
  try { localStorage.setItem(KEY, JSON.stringify(rows)); unsaved = false; }
  catch (e) { status('Storage full: download the CSV, then clear the log.'); }
}

function add(r) {
  rows.push(r);
  unsaved = true;
  render();
}

function render() {
  const last = rows[rows.length - 1];
  $('now').textContent = last ? `${last[2].toFixed(dec(last[2]))} lux` : '-- lux';
  $('log').innerHTML = rows.slice(-20).reverse().map(r =>
    `<tr><td>${stamp(r[0])}</td><td>${r[2].toFixed(dec(r[2]))}</td><td>${r[3]}</td></tr>`).join('');
  draw();
}

function draw() {
  const c = $('graph'), g = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  g.scale(dpr, dpr);
  const W = c.clientWidth, H = c.clientHeight, L = 56, B = 20;
  const win = Number($('win').value) * 1000;
  const pts = win ? rows.filter(r => r[0] >= Date.now() - win) : rows;
  g.font = '12px system-ui'; g.fillStyle = '#bbb';
  if (pts.length < 2) { g.fillText('Waiting for data...', L, H / 2); return; }

  let lo = Infinity, hi = -Infinity;
  for (const r of pts) { lo = Math.min(lo, r[2]); hi = Math.max(hi, r[2]); }
  if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const m = (hi - lo) * 0.1; lo = Math.max(0, lo - m); hi += m;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const x = t => L + (t - t0) / Math.max(1, t1 - t0) * (W - L - 4);
  const y = v => 4 + (hi - v) / (hi - lo) * (H - B - 8);

  g.strokeStyle = '#333'; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, yy = y(v);
    g.beginPath(); g.moveTo(L, yy); g.lineTo(W, yy); g.stroke();
    g.fillText(v.toFixed(dec(hi)), 2, yy + 4);
  }
  g.fillText(stamp(t0).slice(11), L, H - 4);
  const end = stamp(t1).slice(11);
  g.fillText(end, W - g.measureText(end).width - 4, H - 4);

  g.strokeStyle = '#fc3'; g.lineWidth = 2; g.beginPath();
  pts.forEach((r, i) => {
    if (i === 0 || r[0] - pts[i - 1][0] > GAP_MS) g.moveTo(x(r[0]), y(r[2]));
    else g.lineTo(x(r[0]), y(r[2]));
  });
  g.stroke();
}

async function connect() {
  try {
    port = await navigator.serial.requestPort({ allowedBluetoothServiceClassIds: [SPP] });
    await port.open({ baudRate: 115200 });  // baud is ignored over Bluetooth
  } catch (e) { port = null; status('Not connected: ' + e.message); return; }

  status('Connected. Waiting for the first line...');
  $('conn').textContent = 'Disconnect';
  const td = new TextDecoder();
  let buf = '', got = 0;
  lastRx = Date.now();
  reader = port.readable.getReader();
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      lastRx = Date.now();
      buf += td.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const l of lines) {
        got++;
        const r = parseLine(l, Date.now());
        if (r) add(r);
        status(`Connected. ${got} lines received. Last: "${l.trim()}"`);
      }
    }
    status('Disconnected.');
  } catch (e) {
    status('Connection lost: ' + e.message);
  } finally {
    reader.releaseLock();
    await port.close().catch(() => {});
    port = reader = null;
    $('conn').textContent = 'Connect';
    save();
  }
}

$('conn').onclick = () => reader ? reader.cancel() : connect();

$('csv').onclick = () => {
  save();
  const text = 'time,millis,lux,gain\n' + rows.map(r => `${stamp(r[0])},${r[1]},${r[2]},${r[3]}`).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = `lux_${stamp(Date.now()).replace(/[: ]/g, '-')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

$('clear').onclick = () => {
  if (!confirm('Delete all logged rows? Download the CSV first if you need them.')) return;
  rows = []; localStorage.removeItem(KEY); unsaved = false; render();
};

$('win').onchange = draw;
window.onresize = draw;
// shortcut: whole log rewritten to localStorage every 30 s (~5 MB limit, about 12 h at 2 rows/s); move to IndexedDB if you log for days.
setInterval(save, 30000);
setInterval(() => {
  if (reader && Date.now() - lastRx > 5000)
    status('Connected, but nothing received for 5 s. Is HOLD on? On Windows, pick the "Outgoing" COM port ' +
           '(Bluetooth settings > More Bluetooth options > COM Ports). Re-upload lux_meter_bt.ino if unsure.');
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('beforeunload', save);

if (!('serial' in navigator)) {
  $('conn').disabled = true;
  status('This browser has no Web Serial. Use Chrome or Edge on Windows, or Chrome 138+ on Android.');
}
render();
</script>
</body>
</html>
